name: JDT Windows Integration

on:
  push:
    branches:
      - are-jdt-official-parsers
  workflow_dispatch:

jobs:
  windows-jdt:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify Windows executables
        shell: pwsh
        run: |
          where.exe java
          where.exe mvn
          java -version
          mvn -version

      - name: Build JDT bridge
        shell: pwsh
        run: mvn -f jdt_bridge/pom.xml -DskipTests clean package

      - name: Run JDT Maven integration test
        shell: pwsh
        run: python -m pytest -q tests/test_jdt_maven_integration.py

      - name: Run Java parser regressions
        shell: pwsh
        run: python -m pytest -q tests/test_java_parser.py tests/test_java_build_metadata.py tests/test_jdt_health_conservatism.py tests/test_official_cucumber.py
